services:
  - type: web
    name: cortex-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.render.txt
    startCommand: python server.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: HOST
        value: 0.0.0.0
      - key: SKIP_LOCAL_MODEL
        value: "true"
      - key: CORTEX_DATA_DIR
        value: data
      - key: CORS_ALLOW_ORIGINS
        value: https://cortex-frontend-t53t.onrender.com
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: ^https://.*\.onrender\.com$|^https://.*\.trycloudflare\.com$|^https?://(localhost|127\.0\.0\.1)(:\d+)?$
      - key: GOOGLE_API_KEY
        sync: false

  - type: web
    name: cortex-frontend
    env: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://cortex-backend-dbcv.onrender.com/api
